# Builds a universal "HDR Shield.app" on every push and pull request.
# Pushing a tag like v1.0 also publishes a GitHub release with the zipped app.
# 每次 push 和 pull request 都会构建通用二进制的「HDR Shield.app」。
# 推送形如 v1.0 的 tag 时,还会发布带有 zip 包的 GitHub release。

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: bash build.sh

      - name: Verify architectures
        run: |
          archs="$(lipo -archs "HDR Shield.app/Contents/MacOS/HDRShield")"
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

      - name: Package
        run: ditto -c -k --keepParent "HDR Shield.app" HDR-Shield.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HDR-Shield
          path: HDR-Shield.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" HDR-Shield.zip --title "$GITHUB_REF_NAME" --generate-notes
