name: 外接 HDR 显示器测试
description: 报告 HDR Shield 在你的外接 HDR 显示器上是否有效（测试阶段）。
title: "[外接显示器] "
labels: ["external-display"]
body:
  - type: markdown
    attributes:
      value: |
        感谢帮忙测试！填写之前：
        1. 在「系统设置 → 显示器」里为这台显示器开启 **高动态范围**。
        2. 在 HDR Shield 菜单的 **应用于：** 下面勾选这台显示器，然后在它上面播放一段 HDR 视频。手头没有的话，可以试试 [Pexels 上的这段 HDR 视频](https://www.pexels.com/video/blooming-phlox-in-a-lush-outdoor-garden-34261113/)。

  - type: dropdown
    id: result
    attributes:
      label: HDR 高光被压暗了吗？
      options:
        - "是，高光保持在正常亮度"
        - "部分压暗，变暗了但仍比正常亮"
        - "没有，没有任何变化"
        - "这台显示器在菜单里显示为灰色的（SDR）"
        - "不确定"
    validations:
      required: true

  - type: input
    id: display
    attributes:
      label: 显示器型号
      placeholder: 例如 LG 27UQ850、Apple Pro Display XDR
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: 连接方式
      options:
        - 雷雳 / USB-C
        - HDMI
        - DisplayPort
        - 通过扩展坞或转接头
        - 其他
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac 型号
      placeholder: 例如 MacBook Pro 14 英寸，M3 Pro，2023 年
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: 例如 macOS 15.5
    validations:
      required: true

  - type: dropdown
    id: flicker
    attributes:
      label: 取消勾选某台显示器时，其他显示器有没有闪一下？
      options:
        - "有"
        - "没有"
        - "没试过"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 其他信息
      description: 截图、其他会修改显示器颜色的 app（BetterDisplay、f.lux 等），或者你注意到的任何异常。
    validations:
      required: false
